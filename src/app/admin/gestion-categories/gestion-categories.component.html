<div class="gestion-container">
  <div class="page-header">
    <h2>Gestion des Catégories</h2>
    <button class="btn-add" (click)="clickAddCategorie()">
      ➕ Ajouter une Catégorie
    </button>
  </div>

  <div class="search-bar">
    <input 
      type="text" 
      [(ngModel)]="searchTerm" 
      (keyup)="filterCategories()" 
      placeholder="🔍 Rechercher par nom ou description..."
      class="search-input">
  </div>

  <div class="categories-grid">
    <div class="categorie-card" *ngFor="let categorie of filteredCategorieData">
      <div class="categorie-info">
        <h3>{{ categorie.nom }}</h3>
        <p class="description">{{ categorie.description || 'Aucune description' }}</p>
        
        <div class="categorie-actions">
          <button class="btn-edit" (click)="onEdit(categorie)">
            ✏️ Modifier
          </button>
          <button class="btn-delete" (click)="deleteCategorie(categorie)">
            🗑️ Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="no-categories" *ngIf="filteredCategorieData?.length === 0">
    <p> Aucune catégorie trouvée</p>
  </div>
</div>


<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="modal-title">
        {{showAddButton ? '➕ Ajouter une Catégorie' : '✏️ Modifier la Catégorie'}}
      </h5>
      <button type="button" class="close-btn" (click)="closeModal()">×</button>
    </div>
    
    <div class="modal-body">
      <form [formGroup]="formValue">
        <div class="form-group">
          <label for="nom" class="form-label">Nom *</label>
          <input type="text" class="form-control" id="nom" formControlName="nom" placeholder="Ex: Développement Web">
        </div>

        <div class="form-group">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" formControlName="description" rows="4" placeholder="Description de la catégorie..."></textarea>
        </div>
      </form>
    </div>
    
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="closeModal()">Fermer</button>
      <button type="button" class="btn btn-primary" (click)="postCategorieDetails()" *ngIf="showAddButton">
        ➕ Ajouter
      </button>
      <button type="button" class="btn btn-warning" (click)="updateCategorieDetails()" *ngIf="!showAddButton">
        ✏️ Modifier
      </button>
    </div>
  </div>
</div>
